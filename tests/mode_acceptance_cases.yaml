version: 0.2.0
cases:
  - key: system_poem_actor_manifestation
    mode: system
    source_profile_number: "0000000004"
    input: "Послушай мой стих. По нему хочу понять, как лучше проявиться как специалист."
    expected_route: SYSTEM_INTERPRET_THEN_HANDOFF
    must_do:
      - "Сначала внимательно прочитать и понять сам текст, а не отказываться от него"
      - "Рассмотреть текст как артефакт проявления Актора"
      - "Извлечь из текста образ Актора, заявленную роль, намерение, сильные стороны, противоречия и потенциальную траекторию"
      - "Показать системную проекцию: как это может проявиться в Neo World через профиль, сущности, роли, проект, продукт, услугу, контент или Creator"
      - "Использовать ORB MAX, чтобы показать релевантные потенциальные пути, а не только существующие объекты"
      - "Если запрос уходит в глубокий литературный разбор, длительную редактуру или внешнюю персональную работу — мягко предложить продолжение в YNY CHAT после системной интерпретации"
    must_not_do:
      - "Мгновенно отправлять пользователя в YNY CHAT, не прочитав и не поняв материал"
      - "Игнорировать сведения об Акторе, содержащиеся в произведении"
      - "Вести длинную внешнюю маркетинговую или литературную работу так, будто SYSTEM = YNY CHAT"
      - "Сводить стих только к объекту, который можно сохранить на полке"

  - key: system_poem_deep_literary_analysis
    mode: system
    input: "Хочу часами разбирать метрику, ритм, рифмы и редактировать каждую строку этого стихотворения."
    expected_route: SYSTEM_INTERPRET_THEN_HANDOFF
    must_do:
      - "Коротко понять произведение и его значение как проявление Актора"
      - "Объяснить, что глубокая литературная работа лучше продолжается в YNY CHAT"
      - "Перенести туда текущий материал и контекст без требования присылать стих заново"
    must_not_do:
      - "Отказывать в чтении стихотворения"
      - "Начинать полноценную длительную редактуру в SYSTEM"

  - key: system_entity_violets
    mode: system
    input: "Фиалки"
    expected_route: NEO_WORLD_ENTITY_FIRST
    must_do:
      - "Искать сущность и паспорт ФИАЛКА/ФИАЛКИ в Neo World"
      - "Показать связанные объекты, контент, товары и пути проявления"
      - "Если паспорта нет — предложить Creator и создание паспорта"
    must_not_do:
      - "Начинать общую ботаническую энциклопедию"
      - "Заменять отсутствующие внутренние данные внешним общим знанием"

  - key: ynychat_poem_analysis
    mode: ynychat
    input: "Послушай мой стих и подробно его разберём."
    expected_route: HANDLE_IN_MODE
    must_do:
      - "Провести содержательный литературный анализ"
      - "Следовать теме пользователя"
      - "Использовать релевантный личный контекст"
    must_not_do:
      - "Сводить разговор к Neo World без необходимости"

  - key: corp_poetry_collection
    mode: corp
    input: "Разбери сборник стихов и подготовь его к публикации."
    expected_route: MULTI_AGENT_PRODUCTION
    must_do:
      - "Разложить задачу на параллельные роли"
      - "Сделать несколько независимых оценок/редактур"
      - "Свести результаты, сравнить варианты и подготовить финальный пакет"
    must_not_do:
      - "Работать как одиночный простой чат без оркестрации"
