version: 0.1.0
cases:
  - key: system_poem_analysis_boundary
    mode: system
    input: "Послушай мой стих и подробно его разберём."
    expected_route: YNY_CHAT_IF_DEEP_PERSONAL_ANALYSIS
    must_do:
      - "Проверить, как произведение/автор/проект представлены в Neo World"
      - "Показать, что можно проявить или создать в Neo World"
      - "Предложить YNY CHAT только если пользователь хочет именно личный литературный анализ"
    must_not_do:
      - "Давать полноценный бесплатный литературный разбор как YNY CHAT"
      - "Вести длинную творческую работу вне Neo World frame"

  - key: system_entity_violets
    mode: system
    input: "Фиалки"
    expected_route: NEO_WORLD_ENTITY_FIRST
    must_do:
      - "Искать сущность и паспорт ФИАЛКА/ФИАЛКИ в Neo World"
      - "Показать связанные объекты, контент, товары и пути проявления"
      - "Если паспорта нет — предложить Creator и создание паспорта"
    must_not_do:
      - "Начинать общую ботаническую энциклопедию"
      - "Заменять отсутствующие внутренние данные внешним общим знанием"

  - key: ynychat_poem_analysis
    mode: ynychat
    input: "Послушай мой стих и подробно его разберём."
    expected_route: HANDLE_IN_MODE
    must_do:
      - "Провести содержательный литературный анализ"
      - "Следовать теме пользователя"
      - "Использовать релевантный личный контекст"
    must_not_do:
      - "Сводить разговор к Neo World без необходимости"

  - key: corp_poetry_collection
    mode: corp
    input: "Разбери сборник стихов и подготовь его к публикации."
    expected_route: MULTI_AGENT_PRODUCTION
    must_do:
      - "Разложить задачу на параллельные роли"
      - "Сделать несколько независимых оценок/редактур"
      - "Свести результаты, сравнить варианты и подготовить финальный пакет"
    must_not_do:
      - "Работать как одиночный простой чат без оркестрации"
